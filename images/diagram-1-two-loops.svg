<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" role="img" aria-label="Two loops. Off switch: noise shows up, use the routine to make it go away, check whether it has gone, it is still there so the routine has failed, leading to more checking, worry and noise. Anchor: noise shows up, notice it and let it be there, come back to your routine and focus, commit to the skill, and over time the noise often has less grip.">
    <defs>
      <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000"/></marker>
      <marker id="aY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFE500"/></marker>
    </defs>
    <!-- panel 1 -->
    <rect x="0" y="0" width="680" height="150" fill="#F4F4F1"/>
    <text x="16" y="27" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="600" font-size="13.5" letter-spacing="1.5" fill="#000">IF YOUR ROUTINE IS AN OFF SWITCH</text>
    <text x="664" y="27" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" fill="#555">The noise becomes the problem to solve</text>
    <g font-family="Inter, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#000">
      <rect x="16" y="42" width="140" height="50" fill="#fff" stroke="#000" stroke-width="1.2"/>
      <text x="86" y="63">Noise shows up</text><text x="86" y="78" fill="#555" font-size="9.5">thoughts, nerves, body</text>
      <rect x="184" y="42" width="140" height="50" fill="#fff" stroke="#000" stroke-width="1.2"/>
      <text x="254" y="63">Use the routine to</text><text x="254" y="78">make it go away</text>
      <rect x="352" y="42" width="140" height="50" fill="#fff" stroke="#000" stroke-width="1.2"/>
      <text x="422" y="63">Check: has the</text><text x="422" y="78">noise gone?</text>
      <rect x="520" y="42" width="140" height="50" fill="#fff" stroke="#000" stroke-width="1.2"/>
      <text x="590" y="63">Still there, so the</text><text x="590" y="78">routine has “failed”</text>
    </g>
    <g stroke="#000" stroke-width="1.4" fill="none">
      <line x1="158" y1="67" x2="180" y2="67" marker-end="url(#aK)"/>
      <line x1="326" y1="67" x2="348" y2="67" marker-end="url(#aK)"/>
      <line x1="494" y1="67" x2="516" y2="67" marker-end="url(#aK)"/>
      <path d="M590 93 V120 H86 V97" stroke-dasharray="4 3" marker-end="url(#aK)"/>
    </g>
    <rect x="222" y="111" width="236" height="18" fill="#F4F4F1"/>
    <text x="340" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#000">More checking, more worry, more noise</text>

    <!-- panel 2 -->
    <rect x="0" y="168" width="680" height="150" fill="#000"/>
    <text x="16" y="195" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="600" font-size="13.5" letter-spacing="1.5" fill="#FFE500">IF YOUR ROUTINE IS AN ANCHOR</text>
    <text x="664" y="195" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" fill="#BBB">The noise can stay. Your attention has somewhere to go.</text>
    <g font-family="Inter, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#fff">
      <rect x="16" y="210" width="140" height="50" fill="#1A1A1A" stroke="#666" stroke-width="1.2"/>
      <text x="86" y="231">Noise shows up</text><text x="86" y="246" fill="#BBB" font-size="9.5">thoughts, nerves, body</text>
      <rect x="184" y="210" width="140" height="50" fill="#1A1A1A" stroke="#666" stroke-width="1.2"/>
      <text x="254" y="231">Notice it and</text><text x="254" y="246">let it be there</text>
      <rect x="352" y="210" width="140" height="50" fill="#FFE500"/>
      <text x="422" y="231" fill="#000" font-weight="600">Come back to your</text><text x="422" y="246" fill="#000" font-weight="600">routine and focus</text>
      <rect x="520" y="210" width="140" height="50" fill="#1A1A1A" stroke="#666" stroke-width="1.2"/>
      <text x="590" y="231">Commit to</text><text x="590" y="246">the skill</text>
    </g>
    <g stroke="#FFE500" stroke-width="1.4" fill="none">
      <line x1="158" y1="235" x2="180" y2="235" marker-end="url(#aY)"/>
      <line x1="326" y1="235" x2="348" y2="235" marker-end="url(#aY)"/>
      <line x1="494" y1="235" x2="516" y2="235" marker-end="url(#aY)"/>
      <path d="M590 261 V288 H86 V265" stroke-dasharray="4 3" marker-end="url(#aY)"/>
    </g>
    <rect x="212" y="279" width="256" height="18" fill="#000"/>
    <text x="340" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#FFE500">Over time, the noise often has less grip</text>
  </svg>